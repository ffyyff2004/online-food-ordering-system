spring:
  application:
    name: online-food-ordering-system
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:food_ordering}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver

server:
  port: 8080
  servlet:
    context-path: /api

mybatis:
  mapper-locations: classpath:/mapper/*.xml
  type-aliases-package: com.foodordering.entity
  configuration:
    map-underscore-to-camel-case: true

app:
  jwt:
    secret: ${JWT_SECRET:food-ordering-demo-secret-key-change-me-please}
    expiration-hours: ${JWT_EXPIRATION_HOURS:24}
